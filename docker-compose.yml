version: '3.8'

services:
  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: aps_db_1
      MYSQL_USER: aps_user
      MYSQL_PASSWORD: aps_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "9000:9000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: aps_user
      DB_PASSWORD: aps_password
      DB_NAME: aps_db_1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      # 如果 npm install 太慢，改用预编译方式:
      #   1. 先在 frontend 目录执行: npm install && npm run build
      #   2. 把下面 dockerfile 改为 Dockerfile.prebuild
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    depends_on:
      - backend

volumes:
  mysql_data:
